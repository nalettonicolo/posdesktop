<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Pos Generator — Sblocca</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #0f172a, #1e293b);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f1f5f9;
        -webkit-app-region: drag;
      }
      .card {
        width: 320px;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        margin: 0 0 24px;
        min-height: 34px;
      }
      p.error {
        color: #fca5a5;
      }
      button {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.secondary {
        margin-top: 8px;
        background: transparent;
        border: 1px solid #334155;
        color: #cbd5e1;
      }
      button.secondary:hover {
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">PG</div>
      <h1>Pos Generator</h1>
      <p id="status">Verifica la tua identità con Windows Hello per continuare.</p>
      <button id="unlock">Sblocca con Windows Hello</button>
      <button id="quit" class="secondary">Esci</button>
    </div>
    <script src="lock-screen.js"></script>
  </body>
</html>
